name: Validate GitHub evidence collector

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/collect_pr_evidence.py"
      - "scripts/evidence_pack.py"
      - "tests/test_collect_pr_evidence.py"
      - "tests/test_evidence_pack.py"
      - ".github/workflows/collect-evidence-pack.yml"
      - ".github/workflows/evidence-collector-validation.yml"
  workflow_dispatch:
    inputs:
      live_inspector:
        description: Run the bounded read-only live inspector validation
        required: false
        type: boolean
        default: false
      target_sha:
        description: Exact 40-character IssueOps commit SHA to validate
        required: false
        type: string
      issue_number:
        description: Positive IssueOps issue number for the live inspector
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate read-only GitHub collection
    if: ${{ github.event_name == 'pull_request' || inputs.live_inspector != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector tests
        run: python -m unittest discover -s tests -p 'test_collect_pr_evidence.py' -v

      - name: Run evidence-pack core tests
        run: python -m unittest discover -s tests -p 'test_evidence_pack.py' -v

      - name: Compile collector and core
        run: python -m py_compile scripts/collect_pr_evidence.py scripts/evidence_pack.py

  live-inspector:
    name: Validate primary-record inspector against GitHub
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_inspector == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Validate live-inspector inputs
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be exactly 40 hexadecimal characters" >&2
            exit 1
          fi

          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "issue_number must be a positive integer" >&2
            exit 1
          fi

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Verify exact checked-out target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "checked-out commit does not match target_sha" >&2
            exit 1
          fi

          if [[ ! -f scripts/inspect_issueops_issue.py ]]; then
            echo "supported inspector is unavailable at target_sha" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run live read-only inspector
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -uo pipefail

          output_file="$RUNNER_TEMP/live-inspector.json"
          error_file="$RUNNER_TEMP/live-inspector.stderr"

          set +e
          python scripts/inspect_issueops_issue.py \
            "$GITHUB_REPOSITORY" \
            "$ISSUE_NUMBER" \
            --format json \
            >"$output_file" 2>"$error_file"
          status=$?
          set -e

          {
            echo "## Read-only live inspector validation"
            echo
            echo "- Workflow run ID: \`$GITHUB_RUN_ID\`"
            echo "- Run attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Workflow ref: \`$GITHUB_WORKFLOW_REF\`"
            echo "- Workflow SHA: \`$GITHUB_WORKFLOW_SHA\`"
            echo "- Target repository: \`$GITHUB_REPOSITORY\`"
            echo "- Exact target SHA: \`$TARGET_SHA\`"
            echo "- Target issue: \`#$ISSUE_NUMBER\`"
            echo "- Supported tool: \`scripts/inspect_issueops_issue.py\`"
            echo "- Process exit code: \`$status\`"
            echo
            echo "This workflow provides validation evidence only. It grants no lifecycle, review, approval or merge authority."
            echo

            if [[ -s "$output_file" ]]; then
              echo "### Bounded inspector output"
              echo
              echo '```json'
              head -c 20000 "$output_file"
              echo
              echo '```'
              echo
            fi

            if [[ "$status" -ne 0 && -s "$error_file" ]]; then
              echo "### Bounded inspector error"
              echo
              echo '```text'
              head -c 4000 "$error_file"
              echo
              echo '```'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
